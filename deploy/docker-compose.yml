# FlatScan hosted web GUI (TLS + Basic Auth in front of the loopback analyzer).
#
# 1. Point FLATSCAN_SITE's DNS A/AAAA record at this host (FLATSCAN_SITE is your
#    domain, e.g. scan.example.com, which Caddy serves over auto-HTTPS).
# 2. Generate a password hash:  docker run --rm caddy:2-alpine caddy hash-password --plaintext 'your-strong-password'
# 3. Put the values in a .env file next to this one (see deploy/README.md), then:
#      docker compose -f deploy/docker-compose.yml up -d --build
#
# Ports 80/443 must be reachable from the internet for Caddy to obtain a cert.

services:
  flatscan:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      FLATSCAN_SITE: ${FLATSCAN_SITE:?set FLATSCAN_SITE in .env (your domain, e.g. scan.example.com)}
      FLATSCAN_USER: ${FLATSCAN_USER:?set FLATSCAN_USER in .env}
      FLATSCAN_PASSWORD_HASH: ${FLATSCAN_PASSWORD_HASH:?run caddy hash-password and set FLATSCAN_PASSWORD_HASH in .env}
      FLATSCAN_PORT: "5000"
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      # Persist the issued TLS certificate across restarts.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
